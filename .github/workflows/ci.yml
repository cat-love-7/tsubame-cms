# Continuous integration.
#
# Every job runs the same command a developer runs locally, so what passes here is what passes
# on a laptop (and the other way round). There are two Rust jobs because the AWS adapter needs
# emulators: the first runs the scripts/test-rust.sh suite (which skips the AWS half when
# nothing is listening), and the second starts the emulators from the repository's own
# docker-compose.yml and runs that half for real.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (core, local adapter, binaries)
    runs-on: ubuntu-latest
    # A hung job that nobody notices is a queue full of them; the numbers are generous
    # multiples of what the job takes on a good day.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned: `stable` moves under the build, and a night-time release should not be able to
      # break a branch nobody touched. Bumping it is a commit.
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sl_cms
      # Formatting is a check, not a separate task: a diff here is a change in meaning.
      - run: cargo fmt --all --manifest-path sl_cms/Cargo.toml --check
      - run: scripts/test-rust.sh

  rust-aws:
    name: Rust (aws adapter, emulators)
    runs-on: ubuntu-latest
    # A hung job that nobody notices is a queue full of them; the numbers are generous
    # multiples of what the job takes on a good day.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Pinned: `stable` moves under the build, and a night-time release should not be able to
      # break a branch nobody touched. Bumping it is a commit.
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sl_cms
      # The same emulators a developer starts, from the same file: DynamoDB Local and MinIO.
      - name: Start the emulators
        run: docker compose -f sl_cms/docker-compose.yml up -d
      - name: Wait for them to listen
        run: |
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/8000) 2>/dev/null && \
               (exec 3<>/dev/tcp/127.0.0.1/9000) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f sl_cms/docker-compose.yml logs
          exit 1
      - name: The adapter's own tests and the contract suite against it
        working-directory: sl_cms
        run: |
          cargo test -p sl-cms-aws
          cargo test -p sl-cms-tests --test aws
      - name: Stop the emulators
        if: always()
        run: docker compose -f sl_cms/docker-compose.yml down -v

  frontend:
    name: Angular
    runs-on: ubuntu-latest
    # A hung job that nobody notices is a queue full of them; the numbers are generous
    # multiples of what the job takes on a good day.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/sl_cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/sl_cms/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: ../../scripts/test-frontend.sh

  migration:
    name: Migration script
    runs-on: ubuntu-latest
    # Nothing here compiles or downloads anything: the script is dependency-free Node, and its
    # tests are the pure decisions (mapping, ordering, value translation).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: scripts/test-migration.sh

  gatsby-source:
    name: Gatsby source plugin
    runs-on: ubuntu-latest
    # Nothing here compiles or downloads anything either: the plugin's only runtime dependency is
    # `fetch`, and its tests drive the two Gatsby hooks against a faked delivery API.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: scripts/test-gatsby-source.sh

  preview:
    name: Preview package
    runs-on: ubuntu-latest
    # Framework-independent by design: no Gatsby, no browser, no CMS - `fetch` is injected and the
    # delivery API is faked, so this is the same shape as the plugin job above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: scripts/test-preview.sh

  lambda-artifact:
    name: Lambda artifact (arm64)
    runs-on: ubuntu-latest
    # A hung job that nobody notices is a queue full of them; the numbers are generous
    # multiples of what the job takes on a good day.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned: `stable` moves under the build, and a night-time release should not be able to
      # break a branch nobody touched. Bumping it is a commit.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          # The artifact is built for Graviton; nothing here runs it, but it has to build - and a
          # cross build is the kind of thing that rots quietly when only one machine ever does it.
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sl_cms
      # `ring` (the TLS provider the workspace chose over aws-lc-rs) compiles C, so a cross C
      # compiler is needed, not only a linker. Zig brings its own, which is one download rather
      # than a set of packages whose version has to match the runner.
      - name: Zig
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          mkdir -p /tmp/zig
          tar -xJf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"
      - run: cargo install cargo-zigbuild --locked
      - name: Build the artifact
        run: scripts/build-lambda.sh --arch arm64 --zig
      # The script checks the binary itself; this checks what actually gets deployed.
      - name: The zip holds an arm64 bootstrap
        run: |
          unzip -p infra/build/sl-cms-aws-arm64.zip bootstrap > /tmp/bootstrap
          file /tmp/bootstrap
          file /tmp/bootstrap | grep -q 'ARM aarch64'

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    # A hung job that nobody notices is a queue full of them; the numbers are generous
    # multiples of what the job takes on a good day.
    timeout-minutes: 40
    # Slower than the other two and it needs a browser download, so it is not what every push
    # waits on for a first signal.
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      # Pinned: `stable` moves under the build, and a night-time release should not be able to
      # break a branch nobody touched. Bumping it is a commit.
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sl_cms
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/sl_cms/package-lock.json
      - run: npm ci
        working-directory: frontend/sl_cms
      - run: npx playwright install --with-deps chromium
        working-directory: frontend/sl_cms
      - run: scripts/test-e2e.sh
      # The harness writes what it saw to these logs; without them a failure is a mystery.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: /tmp/sl-cms-e2e-*.log
          if-no-files-found: ignore
