# Keep the pinned dependencies current without a person watching them.
#
# One entry per manifest that has dependencies, so each update is its own pull request and CI's
# per-area jobs answer for it: a group keeps a week's non-breaking updates in one pull request
# rather than one per package, which is what a repository with one maintainer wants.
#
# A group holds **minor and patch updates only**. The first run after this file was added made the
# case: the admin group arrived as one pull request with nineteen updates in it, from a patch of
# `jsdom` to TypeScript 7 and Vitest 5 - so the whole thing failed CI and none of the safe updates
# could be taken without also taking the unsafe ones. A major version is a change somebody has to
# make, not a version to bump: it arrives alone, where the pull request, the CI failure and the
# release notes are all about it.
#
# `packages/tsubame-preview` has no dependencies at all (`dependencies: {}`), so there is nothing
# to watch there.
version: 2
updates:
  # The workflows pin an action per job. A stale action is a security report waiting to happen, and
  # these move rarely enough that one weekly pull request is the whole cost.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # `dtolnay/rust-toolchain@1.98.1` is a **Rust version**, not an action version: all four Rust
      # jobs pin the oldest Rust this project claims to support ("Rust 1.98+", README and
      # CONTRIBUTING), so "updating" it would stop testing the claim. The pull request that carried
      # `1.120.0` failed every Rust job and the Lambda build within seconds, because that ref does
      # not exist (the API answers 404 for the tag). Moving the minimum is a decision - the four
      # `uses:` lines and the two documents change together.
      - dependency-name: 'dtolnay/rust-toolchain'

  - package-ecosystem: cargo
    directory: '/backend'
    schedule:
      interval: weekly
    groups:
      crates:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # The admin app is the manifest with the most dependencies of the three.
  - package-ecosystem: npm
    directory: '/frontend'
    schedule:
      interval: weekly
    groups:
      admin:
        patterns: ['*']
        update-types: ['minor', 'patch']
      # The ten `@angular/*` packages are one version and peer-depend on each other, so a major is
      # a change to all of them at once: ten separate pull requests would be ten broken trees, and
      # each one red on its own.
      angular:
        patterns: ['@angular/*']
        update-types: ['major']
      # The coverage provider is the runner's other half and moves with it.
      vitest:
        patterns: ['vitest', '@vitest/coverage-v8']
        update-types: ['major']
    ignore:
      # `@angular/compiler-cli@22.2.0` and `@angular/build@22.2.0` both peer-depend on
      # `typescript: >=6.0 <6.1`, and `typescript-eslint@8.71.0` peers on `>=4.8.4 <6.1.0`, so a
      # TypeScript 7 cannot be installed at all yet: the pull request that carried it failed on the
      # peer resolution, which is a fact about Angular, not about us. Patches and minors inside 6.0
      # still arrive; the major waits until Angular's range widens.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # The plugin's manifest is only the Gatsby it runs its real build test against.
  - package-ecosystem: npm
    directory: '/packages/gatsby-source-tsubame'
    schedule:
      interval: weekly
    groups:
      plugin:
        patterns: ['*']
        update-types: ['minor', 'patch']
      # React and React DOM are one version too, and a tree with 19 and 18 in it is a broken pair -
      # which is exactly how the two separate pull requests for them arrived, and why both failed.
      react:
        patterns: ['react', 'react-dom']
        update-types: ['major']

  # The providers are pinned by `versions.tf` in each root; neither has a lock file to update.
  - package-ecosystem: terraform
    directory: '/infra'
    schedule:
      interval: weekly
    groups:
      providers:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: terraform
    directory: '/infra/bootstrap'
    schedule:
      interval: weekly
    groups:
      providers:
        patterns: ['*']
        update-types: ['minor', 'patch']
