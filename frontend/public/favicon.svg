<!-- The tab's own copy of the mark, from `brand/tsubame-16.svg` - the small-size drawing,
     because a favicon is 16px and the larger one's tail fork closes up there. A favicon is painted
     in the browser's tab strip rather than inside a container, so its colour is stated here rather
     than inherited: near-black for a light tab bar, near-white for a dark one. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="16" height="16" role="img" aria-label="Tsubame">
  <style>
    path { fill: #12212b; }
    @media (prefers-color-scheme: dark) { path { fill: #e8eef2; } }
  </style>
  <title>Tsubame</title>
  <path transform="translate(32 32) scale(1.18) translate(-38.5 -27.5)" d="M62 28 C57 24 51 24 46 26 C40 20 32 15 19 10 C27 17 34 22 38 28 C34 32 31 35 28 37 C25 41 22 43 19 45 C22 41 24 38 26 36 C23 35 19 34 15 34 C20 34 25 34 28 35 C34 33 40 30 46 28 C51 26 57 26 62 28 Z"/>
</svg>
