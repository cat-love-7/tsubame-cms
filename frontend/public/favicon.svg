<!-- The tab's own copy of the mark, from `brand/tsubame-16.svg` - the small-size drawing,
     because a favicon is 16px and the larger one's tail fork closes up there.

     The mark stands on the brand's ink rather than being drawn bare. A tab strip is painted by the
     browser, so the colour a favicon needs cannot be inherited (`currentColor` resolves to black in
     an icon), and asking the browser which scheme it is in does not work everywhere: WebKit ignores
     `prefers-color-scheme` inside an SVG icon, so a dark tab strip drew the near-black bird on
     near-black. The plate is what makes the icon read on either strip without the question being
     asked, and because it is part of the drawing, the `.ico` fallback beside this file can carry the
     same picture (see `frontend/e2e/favicon.mjs`). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="16" height="16" role="img" aria-label="Tsubame">
  <title>Tsubame</title>
  <rect width="64" height="64" rx="14" fill="#12212b"/>
  <g transform="translate(32 32) scale(0.88) translate(-32 -32)">
    <path fill="#e8eef2" transform="translate(32 32) scale(1.18) translate(-38.5 -27.5)" d="M62 28 C57 24 51 24 46 26 C40 20 32 15 19 10 C27 17 34 22 38 28 C34 32 31 35 28 37 C25 41 22 43 19 45 C22 41 24 38 26 36 C23 35 19 34 15 34 C20 34 25 34 28 35 C34 33 40 30 46 28 C51 26 57 26 62 28 Z"/>
  </g>
</svg>
