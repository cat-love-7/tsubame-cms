<div class="toolbar">
  <h2>{{ 'content.compositeFieldTitle' | transloco: { id: compositeId() } }}</h2>
  <span class="spacer"></span>
  <button matButton [routerLink]="['/settings/composite-fields']">
    {{ 'content.allCompositeFields' | transloco }}
  </button>
</div>

<app-notice-toast [notice]="status()" [error]="error()" />
@if (error(); as problem) {
  <p class="error" role="alert">{{ problem | message }}</p>
}

<!-- One item (or an embedded definition): nothing to compare a value against. -->
<app-edit-schema
  [schema]="schema()"
  [uniqueAllowed]="false"
  (save)="save($event)"
></app-edit-schema>
