<mat-toolbar class="app-toolbar">
  <button
    matIconButton
    (click)="toggleNavigation.emit()"
    [attr.aria-label]="'labels.toggleNavigation' | transloco"
    [matTooltip]="'labels.toggleNavigation' | transloco"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <!-- What is being administered, then what administers it: a reader who has two of these open
       reads the deployment's own name first, and Tsubame is the product both are made of. A
       deployment that never named itself is the product's name alone, as it always was. -->
  @if (siteName(); as site) {
    <span class="brand named">
      <span class="site-name">{{ site }}</span>
      <span class="product">{{ 'app.name' | transloco }}</span>
    </span>
  } @else {
    <span class="brand">{{ 'app.name' | transloco }}</span>
  }
  <span class="spacer"></span>
  <app-language-switcher />
  @if (auth.user(); as user) {
    <!-- The username is what an account is known by; the address is optional, and often absent. -->
    <span class="user-email" [title]="user.email ?? ''">{{ user.username }}</span>
  }
  <button
    matIconButton
    routerLink="/account"
    [attr.aria-label]="'auth.changePassword' | transloco"
    [matTooltip]="'auth.changePassword' | transloco"
  >
    <mat-icon>key</mat-icon>
  </button>
  <button
    matIconButton
    (click)="logout()"
    [attr.aria-label]="'common.signOut' | transloco"
    [matTooltip]="'common.signOut' | transloco"
  >
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>
