<h2 mat-dialog-title>{{ 'content.chooseImage' | transloco }}</h2>

<mat-dialog-content>
  @if (error(); as problem) {
    <p class="error" role="alert">{{ problem | message }}</p>
  }

  <div class="library" [class.multi]="data.multi">
    @for (image of library(); track image.id) {
      <button
        type="button"
        class="thumb"
        [class.selected]="isSelected(image.id)"
        (click)="onThumbnail(image)"
        [attr.aria-label]="
          (data.multi ? 'labels.selectImage' : 'labels.useImage') | transloco: { id: image.id }
        "
        [title]="image.original_filename"
      >
        <!-- A tile, so the small copy when there is one (see the image library). -->
        <img
          [src]="imageUrl(image.thumbnail_url || image.url)"
          [alt]="image.original_filename"
          loading="lazy"
        />
        @if (data.multi && isSelected(image.id)) {
          <mat-icon class="tick">check_circle</mat-icon>
        }
      </button>
    } @empty {
      <span class="note">{{ 'content.noImagesUploadFirst' | transloco }}</span>
    }
  </div>

  @if (canLoadMore()) {
    <button
      matButton
      type="button"
      class="load-more"
      (click)="loadMore()"
      [disabled]="loadingMore()"
    >
      {{ (loadingMore() ? 'content.loadingMore' : 'content.loadMore') | transloco }}
    </button>
  }
</mat-dialog-content>

<mat-dialog-actions>
  <!-- The one way to an image that is not in the library yet. It matters most for the Markdown box,
       which has no upload of its own - an empty library used to be a dead end there. -->
  <button
    matButton
    type="button"
    class="upload"
    [disabled]="uploading()"
    (click)="uploadInput.click()"
  >
    <mat-icon>upload</mat-icon>
    {{ (uploading() ? 'content.uploading' : 'content.uploadImage') | transloco }}
  </button>
  <input #uploadInput type="file" accept="image/*" hidden (change)="onFileSelected($event)" />

  <span class="spacer"></span>

  @if (data.multi) {
    <button
      matButton
      type="button"
      class="array-add-selected"
      [disabled]="selected().length === 0"
      (click)="addSelected()"
    >
      {{
        (selected().length === 1 ? 'content.addImageOne' : 'content.addImageOther')
          | transloco: { count: selected().length }
      }}
    </button>
  }
  <button matButton type="button" (click)="close()">{{ 'common.cancel' | transloco }}</button>
</mat-dialog-actions>
