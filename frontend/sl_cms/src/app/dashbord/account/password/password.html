<div class="toolbar">
  <h2>Change password</h2>
</div>

<p class="note">{{ email }} のパスワードを変更します。</p>

@if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
}
@if (status()) {
  <p class="status" role="status">{{ status() }}</p>
}

<form class="form" (ngSubmit)="save()">
  <mat-form-field appearance="fill">
    <mat-label>現在のパスワード</mat-label>
    <input matInput type="password" name="current" [(ngModel)]="current" autocomplete="current-password" />
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>新しいパスワード</mat-label>
    <input matInput type="password" name="next" [(ngModel)]="next" autocomplete="new-password" />
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>新しいパスワード(確認)</mat-label>
    <input matInput type="password" name="repeated" [(ngModel)]="repeated" autocomplete="new-password" />
  </mat-form-field>
  <button matButton color="primary" type="submit">Change password</button>
</form>
