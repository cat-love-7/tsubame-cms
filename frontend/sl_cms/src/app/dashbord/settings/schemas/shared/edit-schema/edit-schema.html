<p class="hint">{{ 'schema.orderHint' | transloco }}</p>

<div class="field-grid" cdkDropList (cdkDropListDropped)="drop($event)">
  @for (field of Schema; track $index) {
    <div class="schema-field field-cell" [style]="cellStyle(field)" cdkDrag>
      <div class="schema-field-header">
        <!-- Only the handle starts a drag: the tile contains text inputs, so making the
             whole tile draggable would break selecting text inside them. -->
        <button
          matIconButton
          type="button"
          cdkDragHandle
          [attr.aria-label]="'labels.dragToReorder' | transloco"
        >
          <mat-icon>drag_indicator</mat-icon>
        </button>
        <span class="schema-field-name">
          {{ field.name || ('schema.unnamedField' | transloco) }}
        </span>
        <span class="schema-field-size">
          {{
            'schema.fieldSize'
              | transloco: { width: field.width, height: field.height }
          }}
        </span>
        <span class="spacer"></span>
        <button
          matIconButton
          type="button"
          (click)="moveUp($index)"
          [disabled]="$index === 0"
          [attr.aria-label]="'labels.moveFieldUp' | transloco"
        >
          <mat-icon>arrow_upward</mat-icon>
        </button>
        <button
          matIconButton
          type="button"
          (click)="moveDown($index)"
          [disabled]="$index === Schema.length - 1"
          [attr.aria-label]="'labels.moveFieldDown' | transloco"
        >
          <mat-icon>arrow_downward</mat-icon>
        </button>
        <button
          matIconButton
          type="button"
          color="warn"
          (click)="removeField($index)"
          [attr.aria-label]="'labels.removeField' | transloco"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>
      @if (preview()) {
        <!-- The same component the content editor uses, so the preview cannot drift from
             the real form. -->
        <app-value-field [field]="field" [value]="previewValue(field)" [disabled]="true" />
      } @else {
        <app-field
          [(field)]="Schema[$index]"
          [uniqueAllowed]="uniqueAllowed"
          [siblingFields]="Schema"
        />
      }

      <!-- Drag either edge to resize. The numeric inputs in the field editor remain the
           keyboard-accessible way to do the same thing. -->
      <span
        class="resize-handle resize-handle-right"
        role="separator"
        [attr.aria-label]="'labels.resizeWidth' | transloco"
        (pointerdown)="startResize(field, 'width', $event)"
        (pointermove)="onResizeMove($event)"
        (pointerup)="endResize()"
        (pointercancel)="endResize()"
      ></span>
      <span
        class="resize-handle resize-handle-bottom"
        role="separator"
        [attr.aria-label]="'labels.resizeHeight' | transloco"
        (pointerdown)="startResize(field, 'height', $event)"
        (pointermove)="onResizeMove($event)"
        (pointerup)="endResize()"
        (pointercancel)="endResize()"
      ></span>
    </div>
  }
</div>

<div class="schema-actions">
  <button matButton type="button" (click)="addField()">
    <mat-icon>add</mat-icon>
    {{ 'schema.addField' | transloco }}
  </button>
  <button matButton type="button" color="primary" (click)="requestSave()">
    <mat-icon>save</mat-icon>
    {{ 'schema.saveSchema' | transloco }}
  </button>
  <button
    matButton
    type="button"
    (click)="togglePreview()"
    [attr.aria-pressed]="preview()"
  >
    <mat-icon>{{ preview() ? 'edit' : 'preview' }}</mat-icon>
    {{ (preview() ? 'schema.editFields' : 'schema.previewLayout') | transloco }}
  </button>
</div>
