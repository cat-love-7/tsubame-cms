<mat-form-field appearance="fill" class="full-width">
  <mat-label>{{ 'schema.compositeFieldType' | transloco }}</mat-label>
  <mat-select name="compositeFieldType" [(ngModel)]="field" >
    @for (compositeField of (compositeFields | async) | keyvalue; track compositeField.key) {
      <mat-option [value]="compositeField.key">{{ compositeField.key }}</mat-option>
    }
  </mat-select>
</mat-form-field>
