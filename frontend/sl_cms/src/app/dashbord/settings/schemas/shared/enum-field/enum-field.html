<mat-form-field appearance="fill" class="full-width">
  <mat-label>{{ 'schema.enumValues' | transloco }}</mat-label>
  <mat-chip-grid #chipGrid>
    @for (value of field(); track value) {
      <mat-chip-row
        (removed)="removeEnumOption(value)"
        [editable]="true"
        (edited)="editEnumOption(value,$event)"
      >
        <button matChipEdit [attr.aria-label]="'schema.editEnumValue' | transloco: { value }">
          <mat-icon>edit</mat-icon>
        </button>
        {{value}}
        <button matChipRemove [attr.aria-label]="'schema.removeEnumValue' | transloco: { value }">
          <mat-icon>cancel</mat-icon>
        </button>
      </mat-chip-row>
    }
    <input [placeholder]="'schema.newEnumValue' | transloco"
      [matChipInputFor]="chipGrid"
      [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
      [matChipInputAddOnBlur]="addOnBlur"
      (matChipInputTokenEnd)="addEnumOption($event)"
    />
  </mat-chip-grid>
</mat-form-field>
