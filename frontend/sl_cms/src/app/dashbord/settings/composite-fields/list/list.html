<h2>Composite fields</h2>

<p class="hint">
  A composite field is a reusable group of fields. Collection and single page schemas can
  reference one by id, and its fields then appear inside that form.
</p>

@if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
}

<div class="new-field">
  <mat-form-field appearance="fill">
    <mat-label>New composite field id</mat-label>
    <input matInput [(ngModel)]="newId" name="newCompositeId" (keyup.enter)="create()" />
  </mat-form-field>
  <button matButton color="primary" (click)="create()">
    <mat-icon>add</mat-icon>
    Add composite field
  </button>
</div>

<table mat-table [dataSource]="definitions" class="mat-elevation-z8">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>Id</th>
    <td mat-cell *matCellDef="let row">{{ row.id }}</td>
  </ng-container>
  <ng-container matColumnDef="fields">
    <th mat-header-cell *matHeaderCellDef>Fields</th>
    <td mat-cell *matCellDef="let row">{{ row.fields }}</td>
  </ng-container>
  <ng-container matColumnDef="schema">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let row">
      <button
        matIconButton
        [routerLink]="['/settings/composite-fields', row.id, 'schema']"
        [attr.aria-label]="'edit schema of ' + row.id"
      >
        <mat-icon>view_column</mat-icon>
      </button>
    </td>
  </ng-container>
  <ng-container matColumnDef="delete">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let row">
      <button matIconButton (click)="delete(row.id)" [attr.aria-label]="'delete ' + row.id">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
