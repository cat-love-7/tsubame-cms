<div class="toolbar">
  <h2>Composite field — {{ compositeId }}</h2>
  <span class="spacer"></span>
  <button matButton [routerLink]="['/settings/composite-fields']">All composite fields</button>
</div>

@if (status()) {
  <p class="status">{{ status() }}</p>
}
@if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
}

<app-edit-schema [Schema]="schema" (save)="save($event)"></app-edit-schema>
