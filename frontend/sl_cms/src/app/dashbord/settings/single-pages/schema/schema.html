<div class="toolbar">
  <h2>Schema — {{ pageName }}</h2>
  <span class="spacer"></span>
  <button matButton [routerLink]="['/single-pages', pageName]">Edit content</button>
  <button matButton [routerLink]="['/settings/single-pages']">All pages</button>
</div>

@if (status()) {
  <p class="status">{{ status() }}</p>
}
@if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
}

<app-edit-schema [Schema]="schema" (save)="save($event)"></app-edit-schema>
