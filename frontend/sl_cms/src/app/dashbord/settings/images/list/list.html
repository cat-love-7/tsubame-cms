<div class="toolbar">
  <h2>Images</h2>
  <span class="spacer"></span>
  <span class="count">
    {{ library().length }} image{{ library().length === 1 ? '' : 's' }}
  </span>
  @if (auth.canEdit()) {
    <button matButton (click)="uploadInput.click()" [disabled]="uploading()">
      <mat-icon>add_photo_alternate</mat-icon>
      {{ uploading() ? 'Uploading…' : 'Upload image' }}
    </button>
  }
  <!-- Hidden: the button above is what a user clicks. -->
  <input #uploadInput type="file" accept="image/*" hidden (change)="onFileSelected($event)" />
</div>

@if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
}

@if (library().length === 0) {
  <p class="note">
    No images yet. Upload one here, or from an image field while editing content.
  </p>
}

<div class="library">
  @for (image of library(); track image.id) {
    <figure class="image">
      <img [src]="imageUrl(image.url)" [alt]="image.original_filename" loading="lazy" />
      <figcaption>
        <span class="name" [title]="image.original_filename">{{ image.original_filename }}</span>
        <span class="meta">id {{ image.id }} · {{ uploadedAt(image) }}</span>
      </figcaption>
      @if (auth.canEdit()) {
        <button
          matIconButton
          class="remove"
          (click)="delete(image)"
          [attr.aria-label]="'delete image ' + image.id"
        >
          <mat-icon>delete</mat-icon>
        </button>
      }
    </figure>
  }
</div>
