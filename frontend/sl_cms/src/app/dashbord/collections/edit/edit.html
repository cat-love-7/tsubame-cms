<div class="toolbar">
  <h2>{{ isNew ? 'New item' : 'Edit item' }} — {{ collectionName }}</h2>
  <span class="spacer"></span>
  <button matButton [routerLink]="['/collections', collectionName]">Cancel</button>
</div>

@if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
}

@if (schema.length === 0) {
  <p class="note">This collection has no fields yet. Add fields in the schema editor first.</p>
}

<!-- The same 12-column grid the schema editor previews, so field widths and order read
     the same in both screens. -->
<div class="field-grid">
  @for (field of schema; track field.name) {
    <div class="field-cell" [style]="cellStyle(field)">
      <app-value-field
        [field]="field"
        [value]="values[field.name]"
        (valueChange)="setValue(field, $event)"
        (errorChange)="setFieldError(field, $event)"
      />
    </div>
  }
</div>

<div class="actions">
  <button matButton color="primary" (click)="save()">Save</button>
</div>
