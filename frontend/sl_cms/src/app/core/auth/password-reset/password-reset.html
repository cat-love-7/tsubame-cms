<div class="reset-page">
  <mat-card class="reset-card">
    <mat-card-header>
      <mat-card-title>新しいパスワードを設定</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <p class="note">
        管理者が発行したリンクから来ています。新しいパスワードを決めてください。
      </p>
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>新しいパスワード</mat-label>
        <input
          matInput
          type="password"
          name="next"
          autocomplete="new-password"
          [(ngModel)]="next"
          (keyup.enter)="save()"
        />
      </mat-form-field>
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>新しいパスワード(確認)</mat-label>
        <input
          matInput
          type="password"
          name="repeated"
          autocomplete="new-password"
          [(ngModel)]="repeated"
          (keyup.enter)="save()"
        />
      </mat-form-field>
      <button matButton color="primary" type="button" (click)="save()" [disabled]="busy()">
        パスワードを設定
      </button>
      <p class="note"><a routerLink="/login">サインインに戻る</a></p>
    </mat-card-content>
  </mat-card>
</div>
