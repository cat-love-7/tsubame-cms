<div class="reset-page">
  <mat-card class="reset-card">
    <mat-card-header>
      <mat-card-title>{{ 'auth.resetTitle' | transloco }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (error(); as problem) {
        <p class="error" role="alert">{{ problem | message }}</p>
      }
      <p class="note">{{ 'auth.resetNote' | transloco }}</p>
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>{{ 'auth.newPassword' | transloco }}</mat-label>
        <input
          matInput
          type="password"
          name="next"
          autocomplete="new-password"
          [(ngModel)]="next"
          (keyup.enter)="save()"
        />
      </mat-form-field>
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>{{ 'auth.newPasswordConfirmation' | transloco }}</mat-label>
        <input
          matInput
          type="password"
          name="repeated"
          autocomplete="new-password"
          [(ngModel)]="repeated"
          (keyup.enter)="save()"
        />
      </mat-form-field>
      <button matButton color="primary" type="button" (click)="save()" [disabled]="busy()">
        {{ 'auth.resetSubmit' | transloco }}
      </button>
      <p class="note">
        <a routerLink="/login">{{ 'auth.backToSignIn' | transloco }}</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
