<div class="callback">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>{{ 'auth.signingIn' | transloco }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (error(); as problem) {
        <p class="error" role="alert">{{ problem | message }}</p>
        <a matButton class="full-width" routerLink="/login">{{
          'auth.backToSignIn' | transloco
        }}</a>
      } @else {
        <p class="note" role="status">{{ 'auth.signingInHint' | transloco }}</p>
      }
    </mat-card-content>
  </mat-card>
</div>
