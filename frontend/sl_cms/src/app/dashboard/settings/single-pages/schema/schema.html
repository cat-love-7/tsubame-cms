<div class="toolbar">
  <h2>{{ 'content.pageSchemaTitle' | transloco: { name: pageName() } }}</h2>
  <span class="spacer"></span>
  <button matButton [routerLink]="['/single-pages', pageName()]">
    {{ 'content.editContent' | transloco }}
  </button>
  <button matButton [routerLink]="['/settings/single-pages']">
    {{ 'content.allPages' | transloco }}
  </button>
</div>

@if (status(); as note) {
  <p class="status">{{ note | message }}</p>
}
@if (error(); as problem) {
  <p class="error" role="alert">{{ problem | message }}</p>
}

<!-- What the page is told about itself, above the fields it is told about its values. -->
<div class="schema-settings">
  <label class="preview-setting">
    <input
      type="checkbox"
      [checked]="preview()"
      (change)="preview.set($any($event.target).checked)"
    />
    <span>{{ 'schema.previewAllowed' | transloco }}</span>
  </label>
  <p class="hint">{{ 'schema.previewAllowedHint' | transloco }}</p>
</div>

<!-- One item (or an embedded definition): nothing to compare a value against. -->
<app-edit-schema
  [schema]="schema()"
  [uniqueAllowed]="false"
  [titleAllowed]="true"
  (save)="save($event)"
></app-edit-schema>
