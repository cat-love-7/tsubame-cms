# Local stand-ins for the AWS services the `aws` backend uses, so its tests can run without an
# account and without a network. Nothing here is used by the on-premises backend: the two are
# separate crates, not features of one binary.
#
#   docker compose -f backend/docker-compose.yml up -d
#   cargo test -p tsubame-aws                # the adapter's own tests
#   cargo test -p tsubame-tests --test aws   # the shared contract suite against it
#
# `scripts/test-rust.sh` runs both, and skips them when nothing is listening on 8000 and 9000.
# The tests point at these endpoints and use these credentials themselves (`test` /
# `test-secret`, as below); `CMS_TEST_DYNAMODB_ENDPOINT`, `CMS_TEST_S3_ENDPOINT`,
# `CMS_TEST_ACCESS_KEY_ID` and `CMS_TEST_SECRET_ACCESS_KEY` override them, so no `AWS_*` variable
# has to be set to run these - a deployment gets its credentials from the execution role, and the
# tests build their clients from the values above.
#
# The emulators reproduce the API, not the behaviour that depends on the real service:
# capacity, throttling, the 400KB item and 1MB query limits, and GSI propagation delays are
# all different in the cloud. Passing here means the adapter's logic is right, not that the
# deployment is (see docs/aws-decisions.md, "Testing policy").
#
# One thing they *can* reproduce, now that it matters: the gateway grants a user exactly the
# policy the deployment has, so a permission-dependent branch is exercised against the same walls
# (`user_with_the_deployment_policy` in crates/aws, and the test that uses it). Without that user,
# root credentials answered for permissions the deployment does not grant, which is how a missing
# `s3:GetObject` stayed invisible. What the emulator does *not* reproduce: real S3 answers 403 for
# a key that is not there unless the caller may list the bucket, while versitygw answers 404
# either way.
#
# The project name is pinned rather than left to the directory: it is the prefix of the container
# names (`tsubame-s3-1`), and the tests that `docker compose exec` into the emulator
# (`crates/aws/src/testing.rs`) have to find the containers that are already running. Moving this
# file would otherwise rename the project with it and leave them looking for containers nobody
# started. The name is the project's, so the containers are renamed with everything else.
name: tsubame
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    # `-sharedDb` keeps every client on one database file, which is what a single test run
    # expects; without it each set of credentials gets its own.
    #
    # It insists on *some* signature, as the real service does: the tests hand it the
    # credentials below (`test` / `test-secret`), while a bare curl is refused. It also refuses an
    # access key id with anything but letters and digits in it (`UnrecognizedClientException`),
    # which is why the restricted user's name has no dash in it.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  s3:
    # versitygw, because MinIO's community server, client and images were archived in 2025 and are
    # no longer served anywhere (Docker Hub answers 404, quay.io 401, dl.min.io 410 - see
    # docs/aws-decisions.md). This gateway is Apache-2.0, still released, and verifies SigV4 for
    # real, so the presigned PUT/GET the adapter hands out are actually exercised.
    #
    # The admin API on 7071 is how the tests create the restricted user: with `--iam-dir` there are
    # no identity policies, so the user's grant is a *bucket* policy that names them
    # (`deployment_bucket_policy` in crates/aws/src/policy.rs). Pinned by tag: an emulator that
    # changes under a build is an emulator whose failures nobody can reproduce.
    image: versity/versitygw:v1.8.0
    command:
      ["--port", ":9000", "--admin-port", ":7071", "--iam-dir", "/iam", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: test
      ROOT_SECRET_KEY: test-secret
    ports:
      - "9000:9000"   # S3 API
      - "7071:7071"   # admin API (the tests create their users here)
    volumes:
      - s3data:/data
      - s3iam:/iam

volumes:
  s3data:
  s3iam:
