# The contract suite. It is not a library anyone depends on: it exists so that one command can
# drive the same HTTP tests against *both* adapters, which is the thing a single crate with
# features could not do.
[package]
name = "tsubame-tests"
description = "The HTTP contract suite, run against every storage adapter."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tsubame-core = { path = "../core" }
tsubame-on-premises = { path = "../on-premises" }
tsubame-aws = { path = "../aws" }
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
uuid.workspace = true
