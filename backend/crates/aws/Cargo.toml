[package]
name = "sl-cms-aws"
description = "The CMS on DynamoDB (single table) and S3."
version.workspace = true
edition.workspace = true

[[bin]]
name = "sl-cms-aws"
path = "src/main.rs"

[dependencies]
sl-cms-core = { path = "../core" }
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-cognitoidentityprovider.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
axum.workspace = true
tower-http.workspace = true
tower.workspace = true
lambda_http.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
aws-sdk-secretsmanager = { version = "1.117.0", default-features = false }

[dev-dependencies]
# The images test exercises the presigned URL the way a browser would: over HTTP.
reqwest.workspace = true
