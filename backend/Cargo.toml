# One workspace for the CMS. Each storage backend is a package of its own, so building one never
# compiles the other (see docs/aws-decisions.md):
#
#   cargo build -p tsubame-on-premises      # rkv + local image files
#   cargo build -p tsubame-aws              # DynamoDB + S3
#   cargo test --workspace                 # everything, including both contract suites
#
# `default-members` keeps a bare `cargo run` / `cargo build` / `cargo test` here on the
# on-premises backend (what a developer runs all day) rather than building every member.
#
# No crate here is published to crates.io: this is a CMS you deploy, not a library you depend on.
# Every manifest says `publish = false`, so a stray `cargo publish` cannot take the names, and
# nothing in the repository can quietly start depending on a version that does not exist.
[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/on-premises",
    "crates/aws",
    "crates/tests",
]
default-members = ["crates/on-premises"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cat-love-7/tsubame-cms"

# Dependencies shared by more than one package. The split is deliberate: the core has no storage
# dependency at all, so neither adapter's tree is reachable from it.
[workspace.dependencies]
tokio = { version = "1.48.0", features = ["full"] }
axum = "0.8.9"
tower-http = { version = "0.7", features = ["cors", "trace"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
chrono = { version = "0.4.42", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
# Password hashing (Argon2id) and JWT signing. `rust_crypto` keeps jsonwebtoken on
# pure-Rust crypto so the build needs no C toolchain for ring/aws-lc-rs.
argon2 = { version = "0.6", features = ["password-hash", "rand_core", "getrandom"] }
jsonwebtoken = { version = "11", default-features = false, features = [
    "rust_crypto",
    # PEM parsing. Pure Rust, so it keeps the "no C toolchain" rule the rest of the stack
    # follows; the tests sign with a key they hold as text.
    "use_pem",
] }
# Outbound webhooks (content events). reqwest 0.13 leaves the TLS crypto provider to the
# process, so `rustls-no-provider` plus an explicit `ring` below keeps the build free of
# CMake, which `aws-lc-rs` (the provider reqwest would otherwise enable) needs. Certificate
# trust comes from the platform store instead of a bundled root list.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# HMAC-SHA256 for the webhook signature.
hmac = "0.13"
sha2 = "0.11"
rkv = "0.20.0"
lambda_http = "1.3.1"
# `legacy-client` on aws-config is deliberate: it selects the rustls stack with the *ring*
# provider. The default HTTPS client would pull aws-lc-rs, which needs CMake to build.
aws-config = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "legacy-client",
] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
] }
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
] }
# Account management: an administrator creates, resets and removes Cognito users from the CMS's
# own account screen (`crates/aws/src/provisioner.rs`). Same features as the others, for the same
# reason: no aws-lc-rs, no CMake.
aws-sdk-cognitoidentityprovider = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
] }
tower = { version = "0.5", features = ["util"] }
strum = "0.28.0"
strum_macros = "0.28.0"
