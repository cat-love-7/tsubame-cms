[package]
name = "sl_cms"
version = "0.1.0"
edition = "2024"

# Exactly one storage backend is selected at compile time, and `main.rs` refuses to build with
# none or with more than one. `gcp` / `azure` are reserved names, not implementations.
#
#   cargo build                                  # on-premises (rkv + local image files)
#   cargo build --no-default-features --features aws   # DynamoDB + S3, not written yet
[features]
default = ["on-premises"]
on-premises = ["dep:rkv"]
aws = [
    "dep:lambda_http",
    "dep:aws-config",
    "dep:aws-sdk-dynamodb",
    "dep:aws-sdk-s3",
]
gcp = []
azure = []

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
axum = "0.8.9"
tower-http = { version = "0.7", features = ["cors", "trace"] }
lambda_http = { version = "1.3.1", optional = true }
# AWS adapter (see doc/aws-plan.md). `legacy-client` on aws-config is deliberate: it selects
# the rustls stack with the *ring* provider. The default HTTPS client would pull aws-lc-rs,
# which needs CMake to build - the same constraint that keeps reqwest on ring.
aws-config = { version = "1", optional = true, default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "legacy-client",
] }
aws-sdk-dynamodb = { version = "1", optional = true, default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
] }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
] }
rkv = { version = "0.20.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
chrono = { version = "0.4.42", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
# Password hashing (Argon2id) and JWT signing. `rust_crypto` keeps jsonwebtoken on
# pure-Rust crypto so the build needs no C toolchain for ring/aws-lc-rs.
argon2 = { version = "0.6", features = ["password-hash", "rand_core", "getrandom"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# Outbound webhooks (content events). reqwest 0.13 leaves the TLS crypto provider to
# the process, so `rustls-no-provider` plus an explicit `ring` below keeps the build
# free of CMake, which `aws-lc-rs` (the provider reqwest would otherwise enable) needs.
# Certificate trust comes from the platform store instead of a bundled root list.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# HMAC-SHA256 for the webhook signature.
hmac = "0.13"
sha2 = "0.11"

[dev-dependencies]
strum = "0.28.0"
strum_macros = "0.28.0"
tower = { version = "0.5", features = ["util"] }
