[package]
name = "sl_cms"
version = "0.1.0"
edition = "2024"

[features]
default = ["on-premises"]
on-premises = ["dep:rkv"]
aws = ["dep:lambda_http"]
gcp = []
azure = []

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
axum = "0.8.9"
tower-http = { version = "0.7", features = ["cors", "trace"] }
lambda_http = { version = "1.3.1", optional = true }
rkv = { version = "0.20.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
chrono = { version = "0.4.42", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
# Password hashing (Argon2id) and JWT signing. `rust_crypto` keeps jsonwebtoken on
# pure-Rust crypto so the build needs no C toolchain for ring/aws-lc-rs.
argon2 = { version = "0.6", features = ["password-hash", "rand_core", "getrandom"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# Outbound webhooks (content events). `ring` rather than the default `aws-lc-rs`
# provider: aws-lc-rs needs CMake, ring only needs a C compiler.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
# HMAC-SHA256 for the webhook signature.
hmac = "0.13"
sha2 = "0.11"

[dev-dependencies]
strum = "0.28.0"
strum_macros = "0.28.0"
tower = { version = "0.5", features = ["util"] }
