[package]
name = "sl_cms"
version = "0.1.0"
edition = "2024"

[features]
default = ["on-premises"]
on-premises = ["dep:actix-web", "dep:rkv", "dep:actix-cors"]
aws = []
gcp = []
azure = []

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
actix-cors = { version = "0.7.1", optional = true }
actix-web = { version = "4", optional = true }
rkv = { version = "0.20.0", optional = true }
serde = "1.0.228"
serde_json = "1.0.148"
chrono = { version = "0.4.42", features = ["serde"] }
env_logger = "0.11.8"
uuid = { version = "1.20.0", features = ["v4","serde"] }

[dev-dependencies]
strum = "0.27.2"
strum_macros = "0.27.2"
