# Local stand-ins for the AWS services the `aws` backend uses, so its tests can run without an
# account and without a network. Nothing here is used by the on-premises backend: the two are
# separate crates, not features of one binary.
#
#   docker compose -f sl_cms/docker-compose.yml up -d
#   cargo test -p sl-cms-aws                # the adapter's own tests
#   cargo test -p sl-cms-tests --test aws   # the shared contract suite against it
#
# `scripts/test-rust.sh` runs both, and skips them when nothing is listening on 8000 and 9000.
# The tests point at these endpoints and use these credentials themselves (`test` /
# `test-secret`, as below); `CMS_TEST_DYNAMODB_ENDPOINT`, `CMS_TEST_S3_ENDPOINT`,
# `CMS_TEST_ACCESS_KEY_ID` and `CMS_TEST_SECRET_ACCESS_KEY` override them, so no `AWS_*` variable
# has to be set to run these - a deployment gets its credentials from the execution role, and the
# tests build their clients from the values above.
#
# The emulators reproduce the API, not the behaviour that depends on the real service:
# capacity, throttling, the 400KB item and 1MB query limits, and GSI propagation delays are
# all different in the cloud. Passing here means the adapter's logic is right, not that the
# deployment is (see doc/aws-plan.md, "テスト方針").
#
# One thing they *can* reproduce, now that it matters: MinIO takes a user whose policy is the
# deployment's, so a permission-dependent branch is exercised against the same walls
# (`restricted_minio_user` in crates/aws, and the test that uses it). Without that user, root
# credentials answered for permissions the deployment does not grant, which is how a missing
# `s3:GetObject` stayed invisible. What MinIO does *not* reproduce: real S3 answers 403 for a key
# that is not there unless the caller may list the bucket, while MinIO answers 404 either way.
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    # `-sharedDb` keeps every client on one database file, which is what a single test run
    # expects; without it each set of credentials gets its own.
    #
    # It insists on *some* signature, as the real service does: the tests hand it the
    # credentials below (`test` / `test-secret`), while a bare curl is refused. It also refuses an
    # access key id with anything but letters and digits in it (`UnrecognizedClientException`),
    # which is why the restricted MinIO user's name has no dash in it.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  s3:
    # MinIO rather than LocalStack: the current LocalStack image refuses to start without a
    # license token (`License activation failed`, exit 55), which would mean every developer
    # and CI run needing an account. MinIO needs no token and verifies SigV4 for real, so the
    # presigned PUT/GET the adapter hands out are actually exercised.
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: test-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console, for looking at what a test left behind
    volumes:
      - minio:/data

volumes:
  minio:
