# Local stand-ins for the AWS services the `aws` backend will use, so its tests can run without
# an account and without a network. Nothing here is used by the default (on-premises) build.
#
#   docker compose up -d
#   AWS_ENDPOINT_URL=http://localhost:8000 AWS_REGION=us-east-1 \
#   AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test \
#   cargo test --no-default-features --features aws
#
# The emulators reproduce the API, not the behaviour that depends on the real service:
# capacity, throttling, the 400KB item and 1MB query limits, and GSI propagation delays are
# all different in the cloud. Passing here means the adapter's logic is right, not that the
# deployment is (see doc/aws-plan.md, "テスト方針").
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    # `-sharedDb` keeps every client on one database file, which is what a single test run
    # expects; without it each set of credentials gets its own.
    #
    # It insists on *some* credentials, as the real service does: the SDK given
    # AWS_ACCESS_KEY_ID=test and AWS_SECRET_ACCESS_KEY=test is happy, a bare curl is not.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  s3:
    # MinIO rather than LocalStack: the current LocalStack image refuses to start without a
    # license token (`License activation failed`, exit 55), which would mean every developer
    # and CI run needing an account. MinIO needs no token and verifies SigV4 for real, so the
    # presigned PUT/GET the adapter hands out are actually exercised.
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: test-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console, for looking at what a test left behind
    volumes:
      - minio:/data

volumes:
  minio:
